<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felhasználói Adatlap</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-img {
            width: 100%;
            max-width: 250px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .stat-badge {
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html">Főoldal</a>
        <a href="user-search.html">Felhasználók keresése</a>
    </nav>

    <div class="container">
        <div id="user-content" class="row">
            <p class="col">Adatok betöltése...</p>
        </div>
        
        <div class="row">
            <div class="col">
                <a href="user-search.html" class="btn btn-secondary">Vissza a kereséshez</a>
            </div>
        </div>
    </div>

    <script>
        async function fetchUserDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('id');
            const container = document.getElementById('user-content');

            if (!username) {
                container.innerHTML = "<p class='col'>Hiba: Nincs megadva felhasználó!</p>";
                return;
            }

            try {
                const response = await fetch(`https://api.github.com/users/${username}`);
                if (!response.ok) throw new Error("A felhasználó nem található.");
                
                const user = await response.json();
                renderUser(user);

            } catch (error) {
                container.innerHTML = `<p class='col' style='color: red;'>${error.message}</p>`;
            }
        }

        function renderUser(user) {
            const container = document.getElementById('user-content');
            
            const getInfoRow = (label, value) => {
                if (!value || value === "" || value === null) return "";
                return `<p><strong>${label}:</strong> ${value}</p>`;
            };

            const blogLink = user.blog ? `<a href="${user.blog.startsWith('http') ? user.blog : 'https://' + user.blog}" target="_blank">${user.blog}</a>` : null;

            container.innerHTML = `
                <div class="col col-2">
                    <img src="${user.avatar_url}" alt="${user.login}" class="profile-img card">
                </div>
                <div class="col col-3">
                    <div class="card">
                        <h1>${user.name || user.login}</h1>
                        <p class="text-muted">@${user.login}</p>
                        <hr>
                        
                        ${getInfoRow("Bio", user.bio)}
                        ${getInfoRow("Helyszín", user.location)}
                        ${getInfoRow("Blog/Weboldal", blogLink)}

                        <div style="margin-top: 20px;">
                            <span class="stat-badge">Repozitóriumok: ${user.public_repos}</span>
                            <span class="stat-badge">Követők: ${user.followers}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        fetchUserDetails();
    </script>

</body>
</html>

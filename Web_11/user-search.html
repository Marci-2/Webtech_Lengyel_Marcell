<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Felhasználó Kereső</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html">Főoldal</a>
        <a href="repo-search.html">Repo keresés</a>
        <a href="user-search.html">Felhasználók keresése</a>
    </nav>

    <div class="container">
        <h1>GitHub Felhasználók</h1>
        
        <div class="card">
            <h3>Keresés</h3>
            <div class="row">
                <div class="col-3">
                    <input type="text" id="searchInput" placeholder="Írd be a GitHub felhasználónevet...">
                </div>
                <div class="col">
                    <button class="btn btn-primary" onclick="searchUsers()">Keresés indítása</button>
                </div>
            </div>
        </div>

        <div id="results" class="row">
            </div>
    </div>

    <script>
        async function searchUsers() {
            const input = document.getElementById('searchInput');
            const resultsDiv = document.getElementById('results');
            const query = input.value.trim();

            if (query === "") {
                alert("Hiba: Kérlek, adj meg egy keresőkifejezést!");
                return;
            }

            resultsDiv.innerHTML = "<p class='col'>Keresés folyamatban...</p>";

            try {
                const response = await fetch(`https://api.github.com/search/users?q=${query}`);
                if (!response.ok) throw new Error("Hiba a lekérdezés során.");

                const data = await response.json();
                displayResults(data.items);
            } catch (error) {
                resultsDiv.innerHTML = `<p class='col'>Hiba: ${error.message}</p>`;
            }
        }

        function displayResults(users) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = ""; 

            if (users.length === 0) {
                resultsDiv.innerHTML = "<p class='col'>Nincs találat.</p>";
                return;
            }

            users.forEach(user => {
                const col = document.createElement('div');
                col.className = 'col col-4'; 

                col.innerHTML = `
                    <div class="card" style="text-align: center;">
                        <img src="${user.avatar_url}" alt="${user.login}" style="width: 100px; border-radius: 50%;">
                        <h4>${user.login}</h4>
                        <a href="user.html?id=${user.login}" class="btn btn-primary">Részletek</a>
                    </div>
                `;
                resultsDiv.appendChild(col);
            });
        }
    </script>

</body>
</html>

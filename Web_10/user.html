<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felhasználói Adatlap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html">Főoldal</a>
        <a href="user-search.html">Felhasználók keresése</a>
    </nav>

    <div class="container">
        <div id="user-content" class="row">
            <p class="col">Adatok betöltése...</p>
        </div>
        
        <div class="row">
            <div class="col">
                <a href="user-search.html" class="btn btn-secondary">Vissza a kereséshez</a>
            </div>
        </div>
    </div>

    <script>
        async function fetchUserDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('id');
            const container = document.getElementById('user-content');

            if (!username) {
                container.innerHTML = "<p class='col'>Nincs felhasználó megadva.</p>";
                return;
            }

            try {
                const response = await fetch(`https://api.github.com/users/${username}`);
                if (!response.ok) throw new Error("A felhasználó nem található.");
                
                const user = await response.json();
                
                const check = (label, val) => (val && val !== "") ? `<p><strong>${label}:</strong> ${val}</p>` : "";

                container.innerHTML = `
                    <div class="col col-2">
                        <img src="${user.avatar_url}" alt="${user.login}" class="card" style="width: 100%;">
                    </div>
                    <div class="col col-3">
                        <div class="card">
                            <h1>${user.name || user.login}</h1>
                            ${check("Bio", user.bio)}
                            ${check("Helyszín", user.location)}
                            ${user.blog ? `<p><strong>Blog:</strong> <a href="${user.blog}">${user.blog}</a></p>` : ""}
                            <p><strong>Repozitóriumok:</strong> ${user.public_repos}</p>
                            <p><strong>Követők:</strong> ${user.followers}</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `<p class='col'>${error.message}</p>`;
            }
        }
        fetchUserDetails();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git App - Repo Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Repository keresés</h1>
    <input type="text" id="repo-search-input" placeholder="Repository elnevezése">
    <button class="btn btn-primary" id="search-btn">Keresés</button>
    <div id="result"></div>

    <script src="app.js"></script>
    <script>
        async function loadRepositories(searchtext) {
            try {
            const res = await fetch('https://api.github.com/search/repositories?q=' + encodeURIComponent(searchtext), {
                headers: {
                    'Authorization': 'Bearer ' + GL_ACCES_TOKEN
                }
            });
            if (!res.ok) {
                throw Error('Hibás válasz, státuszkód: ' + res.status);
            }

            const data = await res.json();

            const resultDiv = document.querySelector('Result');
            resultDiv.innerHTML = '';
            for (const repo of data.items) {
                const repoHtml = `
                    <div class="card"> 
                        <p>$(repo.fullname)</p>
                        <p>$(repo.description)</p>
                        <p>Language: $(repo.language)</p>
                    </div>
                `;
                resultDiv.innerHTML += repoHtml;
            }

            console.log(data);

        } catch (err) {
            console.error(err);
            aler('Hiba történt a keresés során.')
        }

        }

        const searchBtn = document.querySelector('#search-btn');
        searchBtn.addEventListener('click', () => {
            const inputElem = document.querySelector('#repo-search-input');
            const searchText = inputElem.value;dad

            loadRepositories(searchText);
        })
    </script>
</body>
</html>
